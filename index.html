<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Squadre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="homeBtn" class="home-button">🏠 schermata principale</button>

  <section id="loginSection">
    <h2>Accedi</h2>
    <input type="text" id="teamNameInput" placeholder="Inserisci nome squadra o 'admin'">
    <button id="loginBtn">Entra</button>
  </section>

  <section id="teamSection" class="hidden">
    <h2 id="teamTitle"></h2>
    <div id="cardContainer"></div>
    <button id="confirmTeamBtn" class="hidden">Conferma squadra</button>
  </section>

  <section id="adminSection" class="hidden">
    <h2>Area Admin</h2>
    <ul id="adminTeamList"></ul>
  </section>

  <section id="classificaSection" class="hidden">
    <h2>Classifica</h2>
    <ul id="classificaList"></ul>
  </section>

  <section id="bachecaSection" class="hidden">
    <h2>Bacheca</h2>
    <div id="bachecaMessaggio"></div>
    <div id="adminBacheca" class="hidden">
      <textarea id="bachecaInput" placeholder="Scrivi un messaggio..."></textarea>
      <button id="salvaBachecaBtn">Salva messaggio</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
